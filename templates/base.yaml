version: 1
id: general
readiness_criteria:
  - id: baseline-review
    description: The stakeholder reviews the discovery baseline and its supporting evidence.
    kind: review
    role: stakeholder
    on_failure: block
tags:
  sensitive-data: The product handles sensitive information.
  external-actions: The discovery scope includes actions the product performs or directs on external systems, people, or assets. Consider the authorization needed for those actions.
  repeatable-quality: The product needs repeatable evaluation against defined outcomes.
  structural-work: The facility scope includes changes affecting the structure.
  facility-approval: The facility scope has an owner or external approval dependency.
  cross-team-handoff: Work in the process passes between independently accountable teams.
  delegated-signature: Someone will sign the contract under delegated authority.
  material-legal-issue: A material legal issue needs qualified review before drafting can proceed.
dimensions:
  - id: purpose
    question: What outcome should the product achieve, and for whom?
    required: true
  - id: scope
    question: What work belongs inside the product's scope, and where are its boundaries?
    required: true
  - id: stakeholders
    question: Who uses, approves, or is affected by this product?
    required: true
  - id: success
    question: What observable result would tell stakeholders that the product works?
    required: true
  - id: constraints
    question: What limits, dependencies, or obligations shape the product?
    required: true
