version: 1
id: security
readiness_criteria:
  - id: information-handling-approval
    description: The designated authority approves the proposed handling of information and external actions.
    kind: approval
    role: handling-authority
    on_failure: block
applies:
  any:
    - tag: sensitive-data
    - tag: external-actions
dimensions:
  - id: authority
    question: Which actions require approval, and who can grant it?
    required: true
  - id: information-handling
    question: What information may be accessed, retained, or shared, and by whom?
    required: true
